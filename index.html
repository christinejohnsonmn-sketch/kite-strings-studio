<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Strings Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page" id="pickerSheet" style="display:none;">
  <div class="card header-card" style="text-align:center;">
    <div class="header-top" style="justify-content:center;">
      <div class="logo">
        <img src="assets/logo.png" alt="Kite Strings Studio" class="logo-img" />
      </div>
    </div>
    <p class="router-message">It's the weekend — no room is assigned. Where would you like to work?</p>
    <nav class="room-nav">
      <a class="room-pill" href="today-lite-run.html">Lite Run</a>
      <a class="room-pill" href="today-ksd-client.html">KSD Client Work</a>
      <a class="room-pill" href="today-ksd-templates.html">KSD Templates</a>
      <a class="room-pill" href="today-lifestyle.html">KSD Lifestyle</a>
      <a class="room-pill" href="today-visionary.html">Visionary Studio</a>
      <a class="room-pill" href="landing.html">The Landing</a>
    </nav>
  </div>
</div>

<script>
  // Day-of-week router. Runs once when this entry page loads — it never
  // fires again until you come back to index.html, so working inside a
  // specific room and reloading that room's own page never redirects you.
  var DAY_MAP = {
    1: 'today-lite-run.html',     // Monday    → Lite Run
    2: 'today-ksd-client.html',   // Tuesday   → KSD Client Work
    3: 'today-ksd-templates.html',// Wednesday → KSD Templates
    4: 'today-lifestyle.html',    // Thursday  → KSD Lifestyle
    5: 'today-visionary.html'     // Friday    → Visionary Studio
  };
  var day = new Date().getDay(); // 0 = Sunday ... 6 = Saturday
  var target = DAY_MAP[day];
  if (target) {
    window.location.replace(target);
  } else {
    document.getElementById('pickerSheet').style.display = '';
  }
</script>
</body>
</html>
