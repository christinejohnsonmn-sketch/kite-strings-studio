<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Strings Studio — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sheet">
  <svg class="string-svg" id="stringSvg" preserveAspectRatio="none"></svg>

  <header class="masthead">
    <div class="brand">Kite Strings Studio</div>
    <div class="tagline">A calm place to do meaningful work.</div>
    <div class="meta-row">
      <span class="date-pill" id="dateLabel"></span>
      <input class="focus-tag editable" id="focusTag" placeholder="🎨 Focus" />
    </div>
  </header>

  <section id="anchor-mission">
    <div class="eyebrow">Today's Mission</div>
    <input class="mission-input editable" id="mission" placeholder="Create excellent client work." />
  </section>

  <section id="anchor-big3">
    <div class="eyebrow">⭐ Big Three</div>
    <ul class="big-three-list" id="bigThreeList"></ul>
  </section>

  <section id="anchor-now">
    <div class="eyebrow">▶ Now</div>
    <input class="now-input editable" id="nowField" placeholder="What are you doing this very minute?" />
  </section>

  <section id="anchor-upcoming">
    <div class="eyebrow">📌 Upcoming</div>
    <ul class="upcoming-list" id="upcomingList"></ul>
    <button class="add-btn" id="addUpcoming">+ add a small task</button>
  </section>

  <section id="anchor-brain">
    <div class="eyebrow">🧠 Things My Brain Tried to Make Me Do</div>
    <ul class="brain-list" id="brainList"></ul>
    <button class="add-btn" id="addThought">+ catch a thought</button>
  </section>

  <section id="anchor-eod">
    <div class="eyebrow">🌱 End of Day</div>
    <div class="eod-block">
      <label class="eod-label" for="eodMoved">What moved forward?</label>
      <textarea class="eod-textarea editable" id="eodMoved" placeholder="..."></textarea>
    </div>
    <div class="eod-block">
      <label class="eod-label" for="eodTomorrow">What is tomorrow's first move?</label>
      <textarea class="eod-textarea editable" id="eodTomorrow" placeholder="..."></textarea>
    </div>
  </section>

  <div class="save-status" id="saveStatus"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
