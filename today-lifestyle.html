<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Strings Studio — KSD Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <div class="card header-card">
    <div class="header-top">
      <div class="logo">
        <img src="assets/logo.png" alt="Kite Strings Studio" class="logo-img" />
      </div>
      <div class="room-title">
        <span class="name">KSD Lifestyle —</span> <span class="day">Thursdays</span>
      </div>
      <div class="header-date">
        <span class="date-display" id="dateDisplay"></span>
        <div class="date-nav">
          <button type="button" class="date-nav-btn" id="datePrev" aria-label="Previous day">&lsaquo;</button>
          <button type="button" class="date-nav-btn" id="dateNext" aria-label="Next day">&rsaquo;</button>
          <button type="button" class="today-jump" id="todayJump" title="Jump back to today">Today</button>
        </div>
      </div>
    </div>
    <div class="planning-note" id="planningNote"></div>
    <nav class="room-nav">
      <a class="room-pill" href="index.html">🏠 Today</a>
      <a class="room-pill" href="studio-wall.html">🖼️ Studio Wall</a>
      <a class="room-pill" href="today-lite-run.html">Lite Run</a>
      <a class="room-pill" href="today-ksd-client.html">KSD Client Work</a>
      <a class="room-pill" href="today-ksd-templates.html">KSD Templates</a>
      <a class="room-pill active" href="today-lifestyle.html">KSD Lifestyle</a>
      <a class="room-pill" href="today-visionary.html">Visionary Studio</a>
      <a class="room-pill" href="landing.html">The Landing</a>
    </nav>
  </div>

  <div class="room-grid">

    <div class="card timeblocks-card">
      <div class="eyebrow">🕐 Time Blocks</div>
      <ul class="timeblock-list" id="timeBlockList"></ul>
    </div>

    <div class="col-stack">
      <div class="card">
        <div class="planner-section" id="anchor-big3">
          <div class="eyebrow">⭐ Big Three</div>
          <ul class="big-three-list" id="bigThreeList"></ul>
        </div>

        <div class="planner-section" id="anchor-now">
          <div class="eyebrow">▶ Now</div>
          <div class="now-row">
            <span class="reorder-group">
              <button type="button" class="reorder-btn" id="nowUp" aria-label="Pull the top Upcoming item into Now" title="Pull from Upcoming">&#9650;</button>
              <button type="button" class="reorder-btn" id="nowDown" aria-label="Send this item back to Upcoming" title="Send to Upcoming">&#9660;</button>
            </span>
            <input type="checkbox" class="now-check" id="nowCheck" aria-label="Mark current item done and pull the next one up" />
            <input class="now-input editable" id="nowField" placeholder="What are you doing this very minute?" />
          </div>
        </div>

        <div class="planner-section" id="anchor-upcoming">
          <div class="eyebrow">📌 Upcoming</div>
          <ul class="upcoming-list" id="upcomingList"></ul>
          <button class="add-btn" id="addUpcoming">+ add a small task</button>
          <div style="margin-top:8px;"><a class="card-link" href="room-lifestyle.html">KSD Lifestyle Room →</a></div>
        </div>

        <div class="planner-section" style="border-bottom:none;">
          <div class="save-status" id="saveStatus"></div>
        </div>
      </div>

      <div class="card">
        <div class="eyebrow">For The Landing</div>
        <ul class="brain-list" id="brainList"></ul>
        <button class="add-btn" id="addThought">+ pin for later</button>
        <div style="margin-top:8px;"><a class="card-link" href="landing.html">Open full list &rarr;</a></div>
      </div>

      <div class="card">
        <div class="eyebrow">🌱 End of Day</div>
        <div class="eod-block">
          <label class="eod-label" for="eodMoved">What moved forward?</label>
          <textarea class="eod-textarea editable" id="eodMoved" placeholder="..."></textarea>
        </div>
        <div class="eod-block">
          <label class="eod-label" for="eodTomorrow">What is the first move on the next theme day?</label>
          <textarea class="eod-textarea editable" id="eodTomorrow" placeholder="..."></textarea>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  window.KSD_BUSINESS = { slug: 'lifestyle', label: 'KSD Lifestyle', defaultFocus: '🎁 Etsy / Lifestyle' };
</script>
<script src="js/landing-store.js"></script>
<script src="js/today.js"></script>
</body>
</html>
