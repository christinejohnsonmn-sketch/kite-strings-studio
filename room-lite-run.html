<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kite Strings Studio — Lite Run Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <div class="card header-card">
    <div class="header-top">
      <div class="logo">
        <img src="assets/logo.png" alt="Kite Strings Studio" class="logo-img" />
      </div>
      <div class="room-title">
        <span class="name">Lite Run —</span> <span class="day">Room</span>
      </div>
      <div class="header-date">
        <span class="date-display" style="min-width:0;"><a class="card-link" href="today-lite-run.html">→ Today's tasks</a></span>
      </div>
    </div>
    <nav class="room-nav">
      <a class="room-pill" href="index.html">🏠 Today</a>
      <a class="room-pill" href="studio-wall.html">🖼️ Studio Wall</a>
      <a class="room-pill active" href="today-lite-run.html">Lite Run</a>
      <a class="room-pill" href="today-ksd-client.html">KSD Client Work</a>
      <a class="room-pill" href="today-ksd-templates.html">KSD Templates</a>
      <a class="room-pill" href="today-lifestyle.html">KSD Lifestyle</a>
      <a class="room-pill" href="today-visionary.html">Visionary Studio</a>
      <a class="room-pill" href="landing.html">The Landing</a>
    </nav>
  </div>

  <div class="room-lists-grid">
    <div class="card" id="socialCard">
      <div id="socialStaticHolder"></div>
      <hr class="room-subdivider" />
      <div id="contentIdeasHolder"></div>
    </div>

    <div class="card" id="websiteCard"></div>
    <div class="card" id="miscCard"></div>
  </div>

</div>

<script src="js/list-block.js"></script>
<script>
  // ---- Social Media: fixed, non-editable, non-removable recurring items.
  // Auto-resets to unchecked at the start of each week (Monday). ----
  document.getElementById('socialStaticHolder').appendChild(
    window.KSDStaticWeekly.build('📣 Social Media', 'ksd-social-static:lite-run', [
      { key: 'tuesday', label: 'Schedule Tuesday post' },
      { key: 'thursday', label: 'Schedule Thursday post' }
    ], 'lite-run')
  );

  // ---- Content Ideas: plain catch-all list, no sorting ----
  document.getElementById('contentIdeasHolder').appendChild(
    window.KSDListBlock.build('💡 Content Ideas', 'ksd-room-list:lite-run:content-ideas', 'a content idea...', 'lite-run')
  );

  // ---- Website & Misc: checkbox + reorder + optional due date ----
  document.getElementById('websiteCard').appendChild(
    window.KSDTaskList.build('🌐 Website', 'ksd-room-list:lite-run:website', {
      placeholder: 'a website task or note...',
      allowDue: true,
      pushToSlug: 'lite-run'
    })
  );
  document.getElementById('miscCard').appendChild(
    window.KSDTaskList.build('📎 Misc', 'ksd-room-list:lite-run:misc', {
      placeholder: 'anything else...',
      allowDue: true,
      pushToSlug: 'lite-run'
    })
  );
</script>
</body>
</html>
